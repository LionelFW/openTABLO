<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0082" />
    <meta name="description" content="Prochains passages, info trafic et Vélib autour de vous." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>openTABLO</title>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">T</span>openTABLO</h1>
      <button id="change-place" class="link-button" hidden>Changer de lieu</button>
    </header>

    <main id="app">
      <section id="welcome" class="panel" aria-labelledby="welcome-title">
        <h2 id="welcome-title">Les transports autour de vous</h2>
        <p>
          Prochains passages, info trafic et Vélib disponibles près d'un lieu.
          Votre position n'est utilisée que pour cette recherche : elle n'est ni enregistrée ni partagée.
        </p>
        <button id="use-location" class="primary">Utiliser ma position</button>
        <p id="location-error" class="notice" role="alert" hidden></p>

        <form id="address-form" class="address" role="search">
          <label for="address-input">Ou saisissez une adresse</label>
          <input id="address-input" type="search" autocomplete="street-address" placeholder="ex. 54 quai de la Rapée, Paris"
                 aria-controls="address-results" aria-autocomplete="list" />
          <ul id="address-results" class="suggestions" role="listbox" aria-label="Adresses proposées"></ul>
        </form>
      </section>

      <section id="results" hidden aria-live="polite">
        <div class="toolbar">
          <p id="place-label" class="place"></p>
          <label class="radius">
            Rayon
            <select id="radius">
              <option value="200">200 m</option>
              <option value="400">400 m</option>
              <option value="800">800 m</option>
              <option value="1500">1,5 km</option>
            </select>
          </label>
        </div>

        <div class="tabs" role="tablist">
          <button role="tab" id="tab-transit" aria-controls="transit" aria-selected="true">Transports</button>
          <button role="tab" id="tab-velib" aria-controls="velib" aria-selected="false">Vélib'</button>
        </div>

        <div id="transit" role="tabpanel" aria-labelledby="tab-transit"></div>
        <div id="velib" role="tabpanel" aria-labelledby="tab-velib" hidden></div>
      </section>
    </main>

    <footer class="footer">
      Données <a href="https://prim.iledefrance-mobilites.fr" target="_blank" rel="noopener">Île-de-France Mobilités (PRIM)</a>,
      <a href="https://www.velib-metropole.fr" target="_blank" rel="noopener">Vélib' Métropole</a>,
      <a href="https://geoservices.ign.fr" target="_blank" rel="noopener">IGN Géoplateforme</a>.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
